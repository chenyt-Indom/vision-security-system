# ============================================================
# AI 抽烟检测系统 - 配置文件 v2
# 安防级毫秒级本地推理 - 极速版
# ============================================================

cameras:
  - id: "cam_01"
    name: "USB摄像头 #0"
    source: 0
    enabled: true
  - id: "cam_02"
    name: "USB摄像头 #1"
    source: 1
    enabled: true

# ============================================================
# 模型配置 - 本地 ONNX 推理，零网络依赖
# ============================================================
model:
  person_model: "models/yolov8n.onnx"
  smoking_model: "models/smoking.onnx"
  confidence_threshold: 0.30
  iou_threshold: 0.45

# ============================================================
# 性能调优 - 毫秒级检测关键参数
# ============================================================
performance:
  inference_interval: 1
  display_interval: 1
  max_queue_size: 3
  display_fps: true
  display_width: 640
  display_height: 480
  warmup_frames: 10

# ============================================================
# 决策链 - 1帧确认 + 1秒冷却 = 毫秒级报警
# ============================================================
decision:
  confirm_frames: 1
  confirm_window_seconds: 0.5
  cooldown_seconds: 3

# ============================================================
# 告警配置
# ============================================================
alert:
  save_screenshot: true
  screenshot_dir: "alerts"

# ============================================================
# 日志配置
# ============================================================
logging:
  level: "INFO"
  file: "logs/app.log"
  max_size_mb: 20

# ============================================================
# UI 配置
# ============================================================
ui:
  title: "AI 抽烟检测系统 - 安防智能体"
  window_size: [1280, 720]
  refresh_interval_ms: 16
  alert_history_max: 100
  primary_color: "#1E5AA8"